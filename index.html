<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>鼻尖俯卧撑计数器</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#eef6ff;background:#101827}*{box-sizing:border-box}body{margin:0}main{max-width:560px;margin:auto;padding:calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 24px)}h1{font-size:24px;margin:0 0 8px}.muted{color:#9bacc2;font-size:13px}.panel{background:#1c2a3c;border-radius:20px;padding:18px;margin:16px 0}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.field{flex:1}label{display:block;font-size:13px;color:#b6c6d7;margin-bottom:7px}input{width:100%;font-size:20px;color:white;background:#101827;border:1px solid #43566c;border-radius:12px;padding:12px}button{cursor:pointer;border:0;border-radius:14px;padding:13px 17px;font-size:16px;font-weight:700;background:#34465d;color:white;touch-action:manipulation}button.primary{background:#8edbc4;color:#0d2831}button:disabled{opacity:.45}.wide{width:100%}.stat{flex:1;background:#26364a;padding:13px;border-radius:14px;text-align:center}.stat strong{display:block;font-size:23px}.big{font-size:clamp(54px,16vw,100px);font-weight:850;letter-spacing:-3px;text-align:center;color:#8edbc4}.center{text-align:center}.progress{height:12px;border-radius:20px;background:#34465d;overflow:hidden;margin:14px 0}.progress div{height:100%;background:#8edbc4;transition:width .2s}.touch{width:100%;min-height:39vh;border-radius:26px;border:2px solid #537b83;background:#263c4d;color:#c9fff1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}.touch strong{font-size:27px}.touch span{font-size:14px;color:#b3c9d0}.touch:active{background:#375d62}.touch.locked{opacity:.48}.actions{display:flex;gap:10px;margin-top:12px}.actions button{flex:1}.hidden{display:none!important}ul{padding-left:20px}li{margin:10px 0;color:#cbd7e4}.pill{display:inline-block;background:#25493f;color:#9df3d5;border-radius:100px;padding:6px 10px;font-size:12px}#notice{min-height:25px;text-align:center;color:#b6c6d7;margin:8px 0}.small{font-size:12px;color:#9bacc2}#restNumber{font-size:70px;color:#8edbc4;font-weight:800;text-align:center}</style></head><body><main><header class="row"><div><h1>💪 鼻尖俯卧撑</h1><div class="muted">触屏计数 · 自动分组 · 60秒休息</div></div><span class="pill">离线可用*</span></header>
<section id="setup" class="panel"><h2>设置目标</h2><div class="row"><div class="field"><label for="total">总次数</label><input id="total" type="number" min="1" max="10000" value="100" inputmode="numeric"></div><div class="field"><label for="groups">组数</label><input id="groups" type="number" min="1" max="1000" value="5" inputmode="numeric"></div></div><p id="distribution" class="muted"></p><label class="row" style="justify-content:flex-start"><input type="checkbox" id="voice" checked style="width:22px;height:22px">语音报数（中文）</label><label class="row" style="justify-content:flex-start"><input type="checkbox" id="sound" checked style="width:22px;height:22px">震动反馈（设备支持时）</label><button class="primary wide" id="start">开始训练</button><p class="small">自动平均分组，多余次数从前面的组开始分配。首次触摸开始训练可激活语音。</p></section>
<section id="workout" class="hidden"><div class="panel"><div class="row"><span id="groupLabel">第1组</span><span id="status" class="pill">训练中</span></div><div class="big" id="count">0 / 20</div><div class="center muted">本组次数</div><div class="progress"><div id="bar" style="width:0%"></div></div><div class="row"><div class="stat"><strong id="done">0</strong><span class="muted">已完成</span></div><div class="stat"><strong id="goal">100</strong><span class="muted">总目标</span></div><div class="stat"><strong id="left">100</strong><span class="muted">剩余</span></div></div></div><div id="restBox" class="panel hidden"><h2 class="center">休息时间</h2><div id="restNumber">60</div><p class="center muted">休息结束自动进入下一组</p><button id="skip" class="wide primary">跳过休息</button></div><button id="touch" class="touch"><strong>👃 鼻尖轻触这里</strong><span>每次触碰 +1 · 抬起后才能再次计数</span><span>防误触间隔：650毫秒</span></button><div id="notice"></div><div class="actions"><button id="undo">↶ 撤销一次</button><button id="pause">暂停</button><button id="finish">结束并保存</button></div><p class="small">建议屏幕朝上、手机固定在防滑垫上。避免让鼻子撞击手机或使汗水进入接口。屏幕锁定后无法继续触屏计数。</p></section>
<section class="panel"><div class="row"><h2>训练记录</h2><button id="clear" style="font-size:12px;padding:9px">清空记录</button></div><ul id="history"></ul><p class="small">记录保存在当前浏览器的本地存储中；无痕浏览或清除网站数据可能导致记录丢失。</p></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let plan=[],group=0,inGroup=0,done=0,active=false,paused=false,resting=false,restUntil=0,restTimer=null,lastTouch=0,startAt=0;const KEY='nose-pushup-history-v1';const int=(id)=>Number($(id).value);const build=()=>{let n=int('total'),g=int('groups');if(!Number.isInteger(n)||!Number.isInteger(g)||n<1||g<1||n>10000||g>n)return null;return Array.from({length:g},(_,i)=>Math.floor(n/g)+(i<n%g?1:0))};function preview(){let p=build();$('distribution').textContent=p?'每组：'+p.join(' + ')+' = '+p.reduce((a,b)=>a+b,0):'请输入有效目标（组数不能超过总次数）';$('start').disabled=!p}['total','groups'].forEach(id=>$(id).addEventListener('input',preview));preview();function say(s){if(!$('voice').checked||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(String(s));u.lang='zh-CN';u.rate=1.15;speechSynthesis.speak(u)}catch(e){}}function vibrate(n=30){if($('sound').checked&&navigator.vibrate)navigator.vibrate(n)}function notice(s){$('notice').textContent=s}function render(){let total=plan.reduce((a,b)=>a+b,0),target=plan[group]||0;$('groupLabel').textContent=`第 ${group+1} / ${plan.length} 组`;$('count').textContent=`${inGroup} / ${target}`;$('done').textContent=done;$('goal').textContent=total;$('left').textContent=total-done;$('bar').style.width=(target?100*inGroup/target:0)+'%';$('status').textContent=resting?'休息中':paused?'已暂停':active?'训练中':'已结束';$('touch').classList.toggle('locked',!active||paused||resting);$('touch').disabled=!active||paused||resting;$('pause').textContent=paused?'继续':'暂停'}function save(){if(!plan.length)return;let h=read();h.unshift({date:new Date().toLocaleString('zh-CN'),done,goal:plan.reduce((a,b)=>a+b,0),groups:plan.length,seconds:Math.round((Date.now()-startAt)/1000)});try{localStorage.setItem(KEY,JSON.stringify(h.slice(0,100)))}catch(e){}history()}function read(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}function history(){let h=read();$('history').replaceChildren();if(!h.length){let li=document.createElement('li');li.textContent='暂无训练记录';$('history').append(li)}h.forEach(x=>{let li=document.createElement('li');li.textContent=`${x.date} — ${x.done}/${x.goal} 次，${x.groups} 组，${Math.ceil(x.seconds/60)} 分钟`;$('history').append(li)})}function end(){clearInterval(restTimer);restTimer=null;active=false;resting=false;paused=false;$('restBox').classList.add('hidden');render();save();notice('训练已保存！');say('训练结束，辛苦了');$('setup').classList.remove('hidden')}function restEnd(){clearInterval(restTimer);restTimer=null;resting=false;group++;inGroup=0;$('restBox').classList.add('hidden');lastTouch=Date.now();render();notice('下一组开始！');say('休息结束，开始下一组')}function restTick(){if(paused)return;let n=Math.max(0,Math.ceil((restUntil-Date.now())/1000));$('restNumber').textContent=n;if(n<=0)restEnd()}function count(){if(!active||paused||resting)return;let now=Date.now();if(now-lastTouch<650)return;lastTouch=now;inGroup++;done++;vibrate();render();say(inGroup);if(inGroup>=plan[group]){if(group===plan.length-1){setTimeout(end,450)}else{resting=true;restUntil=Date.now()+60000;$('restBox').classList.remove('hidden');restTick();restTimer=setInterval(restTick,250);render();notice('本组完成，休息60秒');setTimeout(()=>say('本组完成，休息六十秒'),400)}}}function touch(e){e.preventDefault();count()}$('touch').addEventListener('pointerdown',touch,{passive:false});$('touch').addEventListener('click',e=>e.preventDefault());$('start').onclick=()=>{let p=build();if(!p)return;plan=p;group=0;inGroup=0;done=0;active=true;paused=false;resting=false;startAt=Date.now();lastTouch=0;$('setup').classList.add('hidden');$('workout').classList.remove('hidden');render();notice('准备好后用鼻尖触碰计数区');say('开始训练')};$('undo').onclick=()=>{if(!active||done===0)return;if(resting){clearInterval(restTimer);restTimer=null;resting=false;$('restBox').classList.add('hidden')}if(inGroup>0){inGroup--;done--}else if(group>0){group--;inGroup=plan[group]-1;done--}lastTouch=Date.now();render();notice('已撤销一次')};$('pause').onclick=()=>{if(!active)return;paused=!paused;if(resting){if(paused){clearInterval(restTimer);restTimer=null;window._restRemaining=Math.max(0,restUntil-Date.now())}else{restUntil=Date.now()+(window._restRemaining||60000);restTimer=setInterval(restTick,250)}}render();notice(paused?'已暂停':'继续训练')};$('skip').onclick=()=>{if(resting&&!paused)restEnd()};$('finish').onclick=()=>{if(active&&confirm('结束本次训练并保存记录？'))end()};$('clear').onclick=()=>{if(confirm('确定删除全部训练记录？')){localStorage.removeItem(KEY);history()}};history();})();
</script></body></html>
